            - heading "Paul Kurtz" [level=3] [ref=e73]
            - paragraph [ref=e74]: One of the founding fathers of secular humanism, Paul Kurtz, who was known for his notion of Eupraxy is a co-author of the 2nd Humanist Manifesto which insisted that secular humanism should not be perceived as a secular religion. He was the founder of Prometheus Books and Center for Skeptical Inquiry. He was a former editor of American Humanist Association's Humanist Magazine.
