    - generic [ref=e27]:
      - paragraph [ref=e29]: DID YOU KNOW?
      - generic [ref=e31]:
        - paragraph [ref=e32]: The secular humanist movement has always been deeply rooted in scholarship, research, and academic work. It has been shaped by philosophers, scientists, historians, secular theologians, psychologists, and public intellectuals whose work transformed how we think about ethics, religion, politics, science, and the human condition.
        - paragraph [ref=e33]: Prominent figures such as Paul Kurtz, Bertrand Russell, John Dewey, A. J. Ayer, Daniel Dennett, B. F. Skinner, Karl Popper, Albert Einstein, Carl Sagan, Stephen Hawking, Corliss Lamont and Isaac Asimov - among many others - have helped shape the rich intellectual tradition from which contemporary and organizational secular humanism continues to grow.
        - paragraph [ref=e34]: All of these thinkers were once part of leading humanist organizations during their lifetime such as the American Humanist Association and Humanists UK, organizations that form part of (and founding member) of its global humanist community - Humanists International - which proudly supports this conference.
        - paragraph [ref=e35]: By participating in this event through HAPI, you join in the same movement these thinkers belonged to and become part of this continuing international intellectual tradition of rigorous, secular and evidence-based scholarship that seeks to better understand humanity, ethics, society, and our place in the world.
        - generic [ref=e36]:
          - paragraph [ref=e37]: You do not need to be an academic.
          - paragraph [ref=e38]: You do not need to present a paper.
          - paragraph [ref=e39]: You only need to bring your curiosity, your questions, and your willingness to think.
          - paragraph [ref=e40]: Perhaps you will leave with answers.Perhaps you will leave with better questions.
          - paragraph [ref=e41]: Either way, you will have taken part in the pursuit. 🔭
        - paragraph [ref=e42]: See more of these thinkers below!
